name: 功能建议 / Feature request
description: 建议一项能改善 Kindle/KOReader 漫画阅读体验的功能。
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请描述使用场景和希望解决的问题。不要提交账号、Cookie 或其他敏感信息。

  - type: textarea
    id: use_case
    attributes:
      label: 使用场景
      description: 你在什么情况下需要这项功能？目前遇到了什么不便？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 希望插件如何表现？如果有多个方案，也可以说明偏好。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代办法
      description: 现在是否有临时解决方式？没有时可填写“无”。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有找到相同建议。
          required: true
        - label: 这项建议不会要求绕过 KOOBONE 权限、破解下载限制或分发他人漫画。
          required: true
