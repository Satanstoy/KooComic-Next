name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "koocomic-ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Lua 5.1 tests and package validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Check for sensitive runtime files
        shell: bash
        run: |
          if find koocomic.koplugin -type f \( -name '*.log' -o -name '*.part' -o -name '*.epub' -o -name 'koobone.lua' -o -name 'koocomic.lua' \) | grep -q .; then
            echo "Runtime or sensitive files found inside plugin package" >&2
            exit 1
          fi

      - name: Check Lua 5.1 syntax
        shell: bash
        run: find koocomic.koplugin spec -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Run regression specs
        shell: bash
        run: |
          for spec_file in spec/*_spec.lua; do
            echo "Running ${spec_file}"
            lua5.1 "${spec_file}"
          done

      - name: Build and test host preprocessing prototype
        run: |
          make -C native/preprocess
          make -C native/preprocess smoke
          python3 spec/native_preprocess_spec.py

      - name: Verify real EPUB processing in the official KOReader runtime
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/koreader/koreader/releases/download/v2026.07.1/koreader-linux-x86_64-v2026.07.1.tar.xz -o /tmp/koreader.tar.xz
          printf '%s  /tmp/koreader.tar.xz\n' 299aadb28147a25e9432ced1214ea444a4184393b5ae97cf42402c8a61b1a1b0 | sha256sum -c -
          mkdir -p /tmp/koreader-runtime /tmp/koocomic-epub-test
          tar -xf /tmp/koreader.tar.xz -C /tmp/koreader-runtime
          cd /tmp/koreader-runtime/lib/koreader
          ./luajit "$GITHUB_WORKSPACE/spec/koreader_epub_integration.lua" "$GITHUB_WORKSPACE" /tmp/koocomic-epub-test
          ./luajit "$GITHUB_WORKSPACE/spec/koreader_file_faults_integration.lua" "$GITHUB_WORKSPACE"
          SDL_VIDEODRIVER=dummy KO_HOME=/tmp/koocomic-components ./luajit "$GITHUB_WORKSPACE/spec/koreader_bookshelf_components_integration.lua" "$GITHUB_WORKSPACE"
          ./luajit "$GITHUB_WORKSPACE/spec/koreader_catalog_integration.lua" "$GITHUB_WORKSPACE"
          ./luajit "$GITHUB_WORKSPACE/spec/koreader_local_manager_integration.lua" "$GITHUB_WORKSPACE"
          ./luajit "$GITHUB_WORKSPACE/spec/koreader_download_queue_integration.lua" "$GITHUB_WORKSPACE"
          ./luajit "$GITHUB_WORKSPACE/spec/koreader_settings_integration.lua" "$GITHUB_WORKSPACE"
          ./luajit "$GITHUB_WORKSPACE/spec/koreader_update_package_integration.lua" "$GITHUB_WORKSPACE"
          ./luajit "$GITHUB_WORKSPACE/spec/koreader_update_transaction_integration.lua" "$GITHUB_WORKSPACE"
          ./luajit "$GITHUB_WORKSPACE/spec/koreader_update_bootstrap_integration.lua" "$GITHUB_WORKSPACE"
          SDL_VIDEODRIVER=dummy ./luajit "$GITHUB_WORKSPACE/spec/koreader_portable_paths_integration.lua" "$GITHUB_WORKSPACE"
          ./luajit "$GITHUB_WORKSPACE/spec/koreader_archive_crc_integration.lua" "$GITHUB_WORKSPACE"
          SDL_VIDEODRIVER=dummy KO_HOME=/tmp/koocomic-http-runtime ./luajit "$GITHUB_WORKSPACE/spec/koreader_download_transport_integration.lua" "$GITHUB_WORKSPACE"
          SDL_VIDEODRIVER=dummy KO_HOME=/tmp/koocomic-ui-runtime ./luajit "$GITHUB_WORKSPACE/spec/koreader_download_queue_ui_integration.lua" "$GITHUB_WORKSPACE"
          SDL_VIDEODRIVER=dummy KO_HOME=/tmp/koocomic-ui-runtime ./luajit "$GITHUB_WORKSPACE/spec/koreader_preprocess_manager_ui_integration.lua" "$GITHUB_WORKSPACE" 600 800
          SDL_VIDEODRIVER=dummy KO_HOME=/tmp/koocomic-ui-runtime ./luajit "$GITHUB_WORKSPACE/spec/koreader_preprocess_manager_ui_integration.lua" "$GITHUB_WORKSPACE" 1024 758
          SDL_VIDEODRIVER=dummy KO_HOME=/tmp/koocomic-ui-runtime ./luajit "$GITHUB_WORKSPACE/spec/koreader_book_versions_ui_integration.lua" "$GITHUB_WORKSPACE" 600 800
          SDL_VIDEODRIVER=dummy KO_HOME=/tmp/koocomic-ui-runtime ./luajit "$GITHUB_WORKSPACE/spec/koreader_book_versions_ui_integration.lua" "$GITHUB_WORKSPACE" 1024 758

      - name: Build a test release package
        shell: bash
        run: |
          version="$(sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' koocomic.koplugin/_meta.lua)"
          ./scripts/package_release.sh "${version}" "${GITHUB_REPOSITORY}" dist-ci

      - name: Verify the package, checksum, and manifest
        shell: bash
        run: |
          unzip -tq dist-ci/release/koocomic.koplugin-*.zip
          cd dist-ci/release
          shasum -a 256 -c koocomic.koplugin-*.zip.sha256
          python3 -m json.tool update.json >/dev/null
          test -s release-notes.md

      - name: Verify full-package upgrade and rollback in KOReader
        shell: bash
        run: |
          packages=("$GITHUB_WORKSPACE"/dist-ci/release/koocomic.koplugin-v*.zip)
          test "${#packages[@]}" -eq 1
          cd /tmp/koreader-runtime/lib/koreader
          SDL_VIDEODRIVER=dummy KO_HOME=/tmp/koocomic-installer-runtime ./luajit "$GITHUB_WORKSPACE/spec/koreader_updater_install_integration.lua" "$GITHUB_WORKSPACE" "${packages[0]}"
